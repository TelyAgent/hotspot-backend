services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotspot_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - hotspot_agent_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hotspot_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hotspot-agent-backend-network

  backend:
    image: ${DOCKER_REGISTRY:-10.168.0.2:5000}/hotspot-agent-backend:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-3002}:3001"
    env_file:
      - .env
    volumes:
      - hotspot_agent_backend_logs:/app/logs
      - ./private:/app/private:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3001) + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - hotspot-agent-backend-network

volumes:
  hotspot_agent_backend_logs:
  hotspot_agent_postgres_data:

networks:
  hotspot-agent-backend-network:
    driver: bridge
