services:
  backend:
    image: ${BACKEND_IMAGE:-10.168.0.2:5000/hotspot-v2-backend:latest}
    ports:
      - "${HOST_PORT:-3002}:3001"
    env_file:
      - .env
    volumes:
      - hotspot_v2_backend_logs:/app/logs
      - ./private:/app/private:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3001) + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - hotspot-v2-backend-network

volumes:
  hotspot_v2_backend_logs:

networks:
  hotspot-v2-backend-network:
    driver: bridge
